name: Fysiken Booking Bot

'on':
  schedule:
    - cron: "50 11 * * *"  
    timezone: "Europe/Stockholm"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fysiken-booking
  cancel-in-progress: false

jobs:
  booking:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run booking bot
        env:
          USERNAME: ${{ secrets.FYSIKEN_USERNAME }}
          PASSWORD: ${{ secrets.FYSIKEN_PASSWORD }}
          CONFIG: config.json
        run: python main.py