
name: Fysiken Booking Bot

on:
schedule:
  - cron: '57 10 * * *'

  - cron: '57 9 * * *'

  workflow_dispatch:

jobs:
  booking:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run booking bot
        env:
          USERNAME: ${{ secrets.FYSIKEN_USERNAME }}
          PASSWORD: ${{ secrets.FYSIKEN_PASSWORD }}
          CONFIG: config.json
        run: python main.py
